[package]
name = "digital-wellbeing"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Private, local-first desktop screen-time tracker"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
rusqlite = { version = "0.38", features = ["bundled"] }
slint = "1.18"
sysinfo = "0.38"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["screensaver"] }

[target.'cfg(windows)'.dependencies]
winrt-toast = "0.1.1"
tray-icon = "0.26.1"

[build-dependencies]
slint-build = "1.18"

[profile.release]
codegen-units = 16
strip = true
